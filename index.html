<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Club Site</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%91%A5</text></svg>">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; height: 100vh; margin: 0; font-family: sans-serif; }
  .links { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3rem; }
  a { text-decoration: none; text-align: center; color: inherit; }
  .icon { display: block; font-size: 6rem; }
</style>
</head>
<body>
  <h1 id="site-title">Club Site</h1>
  <div class="links">
    <a data-page="who-we-are" href="who-we-are/index.html"><span class="icon">🏛️</span>Who We Are</a>
    <a data-page="calender" href="calender/index.html"><span class="icon">📅</span>Calender</a>
    <a data-page="about" href="about/index.html"><span class="icon">👥</span>Our Team</a>
    <a data-page="feedback" href="https://docs.google.com/forms/d/e/1FAIpQLScT0h3Ph6hrFQA-VgD-CpNsoy3BcX07mN5oRUob7Sc38rM9gg/viewform?usp=publish-editor" target="_blank" rel="noopener"><span class="icon">📝</span>Feedback</a>
    <a data-page="rewards" href="rewards/index.html"><span class="icon">🏆</span>Rewards</a>
  </div>
  <script>
    fetch("site.json").then((r) => r.json()).then((site) => {
      if (site.title) {
        document.title = site.title;
        document.getElementById("site-title").textContent = site.title;
      }
      if (site.showIcons === false) {
        document.querySelectorAll(".icon").forEach((el) => el.style.display = "none");
      }
      const hidden = {
        "who-we-are": site.hideWhoWeAre,
        "calender": site.hideCalender,
        "about": site.hideAbout,
        "rewards": site.hideRewards,
        "feedback": site.hideFeedback,
      };
      for (const [page, isHidden] of Object.entries(hidden)) {
        if (!isHidden) continue;
        const tile = document.querySelector(`.links a[data-page="${page}"]`);
        if (tile) tile.style.display = "none";
      }
    }).catch(() => {}); // keep the hardcoded defaults above if this fails
  </script>
</body>
</html>
